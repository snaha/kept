<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kept B0 traits check</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fffdf8; --ink: #1d1b16; --muted: #6b665b; --line: #dcd6c8;
    --accent: #b4491f; --accent-ink: #fff; --chip: #ece7da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15140f; --card: #1e1c16; --ink: #ece8dc; --muted: #9c9686; --line: #343025;
      --accent: #e0703f; --accent-ink: #15140f; --chip: #2a2720;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 160px; }
  h1 { font: 600 28px/1.2 ui-serif, Georgia, serif; margin: 0 0 8px; text-wrap: balance; }
  p.lede { color: var(--muted); margin: 0 0 16px; max-width: 62ch; }
  dl.scales { margin: 0 0 24px; font-size: 14px; color: var(--muted); display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
  dl.scales dt { font-weight: 600; color: var(--ink); }
  dl.scales dd { margin: 0; }
  section.album { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin: 0 0 16px; }
  section.album.answered { border-color: var(--muted); }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h2 { font: 600 19px/1.3 ui-serif, Georgia, serif; margin: 2px 0 12px; overflow-wrap: anywhere; }
  .axis { display: grid; grid-template-columns: 84px 1fr auto; gap: 8px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  @media (max-width: 560px) { .axis { grid-template-columns: 84px 1fr; } .axis .choice { grid-column: 1 / -1; } }
  .axis .name { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .axis .word { font-weight: 600; }
  .choice { display: flex; flex-wrap: wrap; gap: 6px; }
  .choice label { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; user-select: none; font-size: 14px; }
  .choice input { position: absolute; opacity: 0; }
  .choice label:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .choice label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); }
  footer div { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 10px 18px; background: var(--accent); color: var(--accent-ink); cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.quiet { background: var(--chip); color: var(--ink); font-weight: 400; }
  #progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  #result { display: none; background: var(--card); border: 2px solid var(--accent); border-radius: 12px; padding: 20px; margin: 0 0 24px; }
  #result strong { font: 600 22px/1.3 ui-serif, Georgia, serif; display: block; }
  textarea { width: 100%; min-height: 80px; margin-top: 10px; font: 12px ui-monospace, Menlo, monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
</style>
</head>
<body>
<main>
  <h1>Do these estimates look right?</h1>
  <p class="lede">Kept guessed three traits for each album from how it sounds. Each guess is a step on a five-step scale, relative to the rest of your collection. Mark each one as right or wrong. If you do not know the album well enough, say so.</p>
  <dl class="scales" id="scales"></dl>
  <div id="result" role="status"></div>
  <div id="albums"></div>
</main>
<footer><div>
  <button id="reveal" disabled>Show result</button>
  <span id="progress"></span>
  <button id="reset" class="quiet">Clear answers</button>
</div></footer>
<script>
const data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__PAYLOAD__'), c => c.charCodeAt(0))))
const AXES = Object.keys(data.scales)
const OPTIONS = [['right', 'Looks right'], ['wrong', 'Looks wrong'], ['unsure', 'Not sure']]
let answers = {}
try { answers = JSON.parse(localStorage.getItem(data.store) || '{}') } catch {}
const save = () => { try { localStorage.setItem(data.store, JSON.stringify(answers)) } catch {} }
const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props)
  node.append(...children)
  return node
}
const title = text => `${text[0].toUpperCase()}${text.slice(1)}`
document.getElementById('scales').append(...AXES.flatMap(axis => [el('dt', { textContent: title(axis) }), el('dd', { textContent: data.scales[axis].join(' · ') })]))
const albums = document.getElementById('albums')
data.rows.forEach((row, index) => {
  albums.append(el('section', { className: 'album', id: `album-${index}` }, [
    el('div', { className: 'eyebrow', textContent: `Album ${index + 1} of ${data.rows.length}` }),
    el('h2', { textContent: row.album }),
    ...AXES.map(axis => {
      const id = `${index}:${axis}`
      return el('div', { className: 'axis' }, [
        el('span', { className: 'name', textContent: axis }),
        el('span', { className: 'word', textContent: row[axis] }),
        el('div', { className: 'choice', role: 'radiogroup' }, OPTIONS.map(([value, text]) => {
          const input = el('input', { type: 'radio', name: id, value, checked: answers[id] === value })
          input.addEventListener('change', () => {
            answers[id] = value
            save()
            update()
          })
          return el('label', {}, [input, el('span', { textContent: text })])
        })),
      ])
    }),
  ]))
})
const total = data.rows.length * AXES.length
function update() {
  let done = 0
  data.rows.forEach((_, index) => {
    const answered = AXES.filter(axis => answers[`${index}:${axis}`]).length
    done += answered
    document.getElementById(`album-${index}`).classList.toggle('answered', answered === AXES.length)
  })
  document.getElementById('progress').textContent = `${done} of ${total} answered`
  document.getElementById('reveal').disabled = done < total
}
document.getElementById('reveal').addEventListener('click', () => {
  const summary = Object.fromEntries(AXES.map(axis => {
    const picks = data.rows.map((_, index) => answers[`${index}:${axis}`])
    const right = picks.filter(pick => pick === 'right').length
    return [axis, { right, wrong: picks.filter(pick => pick === 'wrong').length, unsure: picks.filter(pick => pick === 'unsure').length, passed: right >= data.pass, picks }]
  }))
  const result = document.getElementById('result')
  result.replaceChildren(
    ...AXES.map(axis => el('strong', { textContent: `${title(axis)}: ${summary[axis].right} of ${data.rows.length} look right — ${summary[axis].passed ? 'passes' : 'does not pass'} the bar of ${data.pass}` })),
    el('span', { textContent: 'Copy this line back to the team:' }),
    el('textarea', { readOnly: true, value: JSON.stringify(summary) }),
  )
  result.style.display = 'block'
  result.scrollIntoView({ block: 'start' })
})
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Clear all answers?')) return
  answers = {}
  save()
  location.reload()
})
update()
</script>
</body>
</html>
