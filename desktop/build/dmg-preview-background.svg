<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600">
  <!-- Native Finder places the app, Applications and Read Me icons over this
       background. Keep their centers in sync with build-configuration.mjs.
       Regenerate PNGs:
       magick -background white -density 192 desktop/build/dmg-preview-background.svg -resize 660x600 -depth 8 desktop/build/dmg-preview-background.png
       magick -background white -density 192 desktop/build/dmg-preview-background.svg -resize 1320x1200 -depth 8 desktop/build/dmg-preview-background@2x.png
       The bottom margin leaves room for Finder's title and status bars. -->
  <rect width="660" height="600" fill="#fafafa"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#18181b">
    <text x="38" y="48" font-size="28" font-weight="700">Install Kept Preview</text>
    <text x="38" y="78" font-size="16" fill="#52525b">Drag the app into Applications, then open it from there.</text>
    <line x1="292" y1="166" x2="366" y2="166" stroke="#71717a" stroke-width="3"/>
    <line x1="354" y1="154" x2="366" y2="166" stroke="#71717a" stroke-width="3"/>
    <line x1="366" y1="166" x2="354" y2="178" stroke="#71717a" stroke-width="3"/>
    <line x1="38" y1="254" x2="622" y2="254" stroke="#d4d4d8"/>
    <text x="38" y="288" font-size="20" font-weight="700">“Apple could not verify” on first launch?</text>
    <text x="38" y="321" font-size="17" font-weight="700">1. Click Done — not Move to Trash.</text>
    <text x="38" y="352" font-size="16">2. Open System Settings / Privacy &amp; Security.</text>
    <text x="38" y="383" font-size="16">3. Scroll to Open Anyway, then approve with</text>
    <text x="58" y="407" font-size="16">Touch ID or your Mac password.</text>
    <text x="38" y="454" font-size="14" fill="#52525b">This preview has not been notarized by Apple.</text>
    <text x="38" y="477" font-size="14" fill="#52525b">Only open it if you trust this download.</text>
    <text x="38" y="510" font-size="14" fill="#52525b">For the full steps, open read-me-first.txt.</text>
  </g>
</svg>
