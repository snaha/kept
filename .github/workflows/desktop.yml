name: desktop
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel (stable publishes only from a version tag)
        type: choice
        options: [preview, stable]
        default: preview
      platforms:
        description: Computers to build for
        type: choice
        options: [mac, linux, both]
        default: mac
      publish:
        description: Publish a preview download page
        type: boolean
        default: false
  pull_request: # preview builds, linked from a comment on the PR
    paths: ['frontend/**', 'desktop/**', 'shared/**', '.github/workflows/desktop.yml']
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  # on a pull request github.sha is the temporary merge commit; name builds after the branch commit instead
  MUSIC_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.options.outputs.channel }}
      mac: ${{ steps.options.outputs.mac }}
      linux: ${{ steps.options.outputs.linux }}
      publish: ${{ steps.options.outputs.publish }}
    steps:
      - id: options
        env:
          BUILD_EVENT: ${{ github.event_name }}
          BUILD_REF: ${{ github.ref }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const tagged = process.env.BUILD_EVENT === 'push' && process.env.BUILD_REF.startsWith('refs/tags/v');
          const channel = tagged ? 'stable' : process.env.INPUT_CHANNEL || 'preview';
          const platforms = tagged ? 'both' : process.env.INPUT_PLATFORMS || 'both';
          const publish = tagged || (process.env.BUILD_EVENT === 'workflow_dispatch' && channel === 'preview' && process.env.INPUT_PUBLISH === 'true');
          appendFileSync(process.env.GITHUB_OUTPUT, `channel=${channel}\nmac=${platforms !== 'linux'}\nlinux=${platforms !== 'mac'}\npublish=${publish}\n`);
          JS
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: '**/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir desktop validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ env.MUSIC_COMMIT }}
          include-hidden-files: true
          if-no-files-found: error
          path: .audit-results/
  mac:
    needs: [prepare, checks]
    if: needs.prepare.outputs.mac == 'true'
    runs-on: macos-15 # Apple Silicon
    outputs:
      notarized: ${{ steps.package.outputs.notarized }}
    env:
      MUSIC_CHANNEL: ${{ needs.prepare.outputs.channel }}
      # Only same-repository PRs can access signing credentials; fork previews are explicitly unnotarized.
      # electron-builder otherwise skips signing on pull requests.
      CSC_FOR_PULL_REQUEST: 'true'
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: node desktop/scripts/check-mac-distribution.mjs
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: '**/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      # The required checks job ran the complete validation for this checkout.
      - id: package
        working-directory: desktop
        run: |
          pnpm dist:mac:package
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { macNotarizationRequired } from './scripts/mac-distribution.mjs'
          const info = JSON.parse(readFileSync('build-info.json', 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `notarized=${macNotarizationRequired(info)}\n`)
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: Kept-mac-arm64-${{ steps.package.outputs.notarized == 'true' && 'notarized' || 'not-notarized' }}-${{ env.MUSIC_COMMIT }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*-README.md
  linux:
    needs: [prepare, checks]
    if: needs.prepare.outputs.linux == 'true'
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm } # native build, so the scripts pick the arm64 navidrome
    runs-on: ${{ matrix.runner }}
    env:
      MUSIC_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: '**/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      # The required checks job ran the complete validation for this checkout.
      - run: pnpm dist:package
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Kept-linux-${{ matrix.arch }}-${{ env.MUSIC_COMMIT }}
          if-no-files-found: error
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
            desktop/release/*-README.md
  release:
    needs: [prepare, checks, mac, linux]
    if: >-
      always() && !cancelled() && needs.checks.result == 'success' && needs.prepare.outputs.publish == 'true' &&
      (needs.mac.result == 'success' || needs.mac.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ github.sha }}-${{ github.run_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: release, pattern: 'Kept-*', merge-multiple: true }
      - run: node desktop/scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MUSIC_CHANNEL: ${{ needs.prepare.outputs.channel }}
          MUSIC_MAC_INCLUDED: ${{ needs.mac.result == 'success' }}
          MUSIC_NOTARIZED: ${{ needs.mac.outputs.notarized }}
  # a PR build keeps one comment on the PR pointing at the run's artifacts, so previews stay off the releases page
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository   # fork PRs get a read-only token
    needs: [checks, mac, linux]
    runs-on: ubuntu-latest
    permissions: { actions: read, pull-requests: write }
    concurrency: preview-${{ github.event.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN: ${{ github.run_id }}
      MAC_NOTARIZED: ${{ needs.mac.outputs.notarized }}
    steps:
      - run: |
          {
            echo "### Preview build for ${SHA::7}"
            echo "Installs as **Kept Preview** next to the regular app. Use Fresh or a portable folder for independent state. Downloads need a GitHub login and expire after 90 days."
            if [ "$MAC_NOTARIZED" = true ]; then
              echo "Mac app: Developer ID signed, notarized by Apple and verified with Gatekeeper."
            else
              echo "**Mac preview: NOT NOTARIZED — Open Anyway required.** After opening the installed Kept Preview once and dismissing the warning, go to **System Settings → Privacy & Security → Open Anyway** and confirm. Only approve a build you trust. [Apple’s instructions](https://support.apple.com/en-us/102445)."
            fi
            echo
            gh api "repos/$GH_REPO/actions/runs/$RUN/artifacts" -q ".artifacts[] | \"- [\(.name)](https://github.com/$GH_REPO/actions/runs/$RUN/artifacts/\(.id))\""
          } > comment.md
          gh pr comment "$PR" --edit-last --body-file comment.md || gh pr comment "$PR" --body-file comment.md
