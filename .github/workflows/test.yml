name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tagsmith:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tagsmith } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: tagsmith/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
